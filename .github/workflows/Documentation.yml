name: Documentation

on:
  push:
    branches:
      - master
      - release/.*
    tags: '*'
  pull_request:

jobs:
  Documenter:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/julia-buildpkg@1
      - uses: julia-actions/julia-docdeploy@1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
